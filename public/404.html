<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6D5EF7"><title>페이지를 찾을 수 없습니다 — ScamScent</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171826;background:#f7f8fc}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);background:white;border:1px solid #e2e4ec;border-radius:24px;padding:36px;box-shadow:0 22px 60px rgba(29,31,48,.12);text-align:center}.mark{width:58px;height:58px;margin:0 auto 18px;border-radius:18px;background:linear-gradient(135deg,#6d5ef7,#8f67ff 58%,#26c6da);display:grid;place-items:center;color:white;font-size:26px;font-weight:900}.code{font-size:12px;font-weight:800;letter-spacing:.14em;color:#6d5ef7}.card h1{margin:8px 0 8px;font-size:32px;letter-spacing:-.04em}.card p{margin:0;color:#676b7e;line-height:1.7}.actions{display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap}a,button{min-height:44px;border-radius:12px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;font:inherit;font-weight:700;cursor:pointer}a{background:#6d5ef7;color:white;text-decoration:none}button{border:1px solid #e2e4ec;background:white;color:#171826}@media(max-width:480px){.card{padding:28px 20px}.actions{display:grid}.actions>*{width:100%}}
</style></head><body><main class="card"><div class="mark">⌁</div><div class="code">404 · LOST SCENT</div><h1>이 페이지의 흔적을 찾지 못했습니다.</h1><p>주소가 바뀌었거나 존재하지 않는 페이지입니다. ScamScent 홈으로 돌아가 새 검사를 시작할 수 있습니다.</p><div class="actions"><a id="home-link" href="/">홈으로 이동</a><button type="button" onclick="history.back()">이전 페이지</button></div></main><script>const p=location.pathname.split('/').filter(Boolean);const h=location.hostname.endsWith('github.io')&&p.length?'/'+p[0]+'/':'/';document.getElementById('home-link').href=h;</script></body></html>
